name: Auto-Improve

on:
  schedule:
    - cron: '0 13 * * *'
  workflow_dispatch:
    inputs:
      focus:
        description: 'Specific focus for this run (leave empty for open improvement)'
        required: false
        default: ''
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.decide.outputs.run }}
      focused: ${{ steps.decide.outputs.focused }}
      focus: ${{ steps.decide.outputs.focus }}
      day: ${{ steps.decide.outputs.day }}
    steps:
      - name: Skip cron if an auto-improve PR is already open
        id: decide
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          FOCUS="${{ github.event.inputs.focus }}"
          echo "day=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> $GITHUB_OUTPUT
            if [ -n "$FOCUS" ]; then
              echo "focused=true" >> $GITHUB_OUTPUT
              echo "focus=$FOCUS" >> $GITHUB_OUTPUT
            else
              echo "focused=false" >> $GITHUB_OUTPUT
              echo "focus=" >> $GITHUB_OUTPUT
            fi
            exit 0
          fi

          echo "focused=false" >> $GITHUB_OUTPUT
          echo "focus=" >> $GITHUB_OUTPUT

          OPEN_PRS=$(gh pr list \
            --repo ${{ github.repository }} \
            --label "auto-improve" \
            --state open \
            --json number \
            --jq 'length')

          if [ "$OPEN_PRS" -gt 0 ]; then
            echo "run=false" >> $GITHUB_OUTPUT
            echo "There are $OPEN_PRS open auto-improve PR(s), skipping cron run"
          else
            echo "run=true" >> $GITHUB_OUTPUT
          fi

  pass-1:
    needs: check
    if: needs.check.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    outputs:
      rate_limited: ${{ steps.run.outputs.rate_limited }}
      input_tokens: ${{ steps.run.outputs.input_tokens }}
      output_tokens: ${{ steps.run.outputs.output_tokens }}
      cache_read: ${{ steps.run.outputs.cache_read }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.claude/bin" >> $GITHUB_PATH

      - name: Run pass 1
        id: run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          FOCUSED="${{ needs.check.outputs.focused }}"
          FOCUS="${{ needs.check.outputs.focus }}"

          if [ "$FOCUSED" = "true" ]; then
            PROMPT="Read CLAUDE.md before making any changes.

          Your FOCUS for this run: $FOCUS. Analyse the repository and implement the improvements that best achieve this focus. No limit on the number of files you can modify.

          RULES:
          - Do not rename public functions/classes/methods
          - Do not change function signatures
          - Do not delete code without verifying it is unreferenced
          - If there is nothing clear to improve, do not force changes

          When done, generate a Markdown summary of the changes:
          - File modified
          - What was changed and why"
          else
            PROMPT="Read CLAUDE.md before making any changes.

          Act as a conservative senior engineer applying TDD, DDD, and Clean Code principles.

          PRIMARY OBJECTIVE — Code quality (always):
          Analyse the repository for the highest-value quality improvements:
          - Improve TypeScript types (stricter types, remove \`any\`, better generics)
          - Apply Clean Code principles (single responsibility, clear naming, reduce complexity)
          - Apply DDD patterns where appropriate (value objects, clear domain boundaries)
          - Add or improve unit/integration tests for untested critical paths
          - Improve error handling, edge cases, and resilience
          - Refactor for clarity and maintainability

          SECONDARY OBJECTIVE — New ideas (only if code looks stable):
          If you judge the code to be already clean and well-structured in the areas you've reviewed,
          you MAY propose and implement ONE meaningful improvement such as:
          - A new useful feature (e.g. export, filters, new view)
          - A significant UX improvement
          - A non-trivial performance optimisation

          RULES:
          - Prioritise quality over new features — do not add features to unstable/messy code
          - Do not rename public functions/classes/methods
          - Do not change function signatures
          - Do not delete code without verifying it is unreferenced
          - If there is nothing clear to improve, do not force changes

          When done, generate a Markdown summary:
          - File modified
          - What was changed and why (quality fix or new idea)"
          fi

          claude -p "$PROMPT" \
          --dangerously-skip-permissions \
          --max-turns 60 \
          --output-format json > /tmp/claude-output.json 2>&1 || true

          if ! jq empty /tmp/claude-output.json 2>/dev/null; then
            echo "::error::Pass 1 — Claude output is not valid JSON. Raw output:"
            head -100 /tmp/claude-output.json
            echo "rate_limited=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          IS_ERROR=$(jq -r '.is_error // false' /tmp/claude-output.json 2>/dev/null)
          RESULT=$(jq -r '.result // ""' /tmp/claude-output.json 2>/dev/null)
          RAW_OUTPUT=$(cat /tmp/claude-output.json 2>/dev/null)

          INPUT_TOKENS=$(jq -r '.usage.input_tokens // 0' /tmp/claude-output.json)
          OUTPUT_TOKENS=$(jq -r '.usage.output_tokens // 0' /tmp/claude-output.json)
          CACHE_READ=$(jq -r '.usage.cache_read_input_tokens // 0' /tmp/claude-output.json)

          echo "### Token usage — Pass 1" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Input tokens | $INPUT_TOKENS |" >> $GITHUB_STEP_SUMMARY
          echo "| Output tokens | $OUTPUT_TOKENS |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache read | $CACHE_READ |" >> $GITHUB_STEP_SUMMARY

          echo "input_tokens=$INPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "output_tokens=$OUTPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "cache_read=$CACHE_READ" >> $GITHUB_OUTPUT

          IS_RATE_LIMITED=false
          if echo "$RESULT$RAW_OUTPUT" | grep -qi "rate limit\|429\|too many requests"; then
            IS_RATE_LIMITED=true
          fi

          if [ "$IS_ERROR" = "true" ] && [ "$IS_RATE_LIMITED" = "false" ]; then
            echo "::error::Pass 1 failed with a non-rate-limit error. Raw output:"
            echo "$RAW_OUTPUT" | head -100
            echo "rate_limited=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$IS_RATE_LIMITED" = "true" ]; then
            echo "rate_limited=true" >> $GITHUB_OUTPUT
            echo "::warning::Pass 1 hit rate limit — pass 2 will be skipped"
          else
            echo "rate_limited=false" >> $GITHUB_OUTPUT
          fi

          echo "$RESULT" > /tmp/claude-summary-pass1.md

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary of changes — Pass 1" >> $GITHUB_STEP_SUMMARY
          cat /tmp/claude-summary-pass1.md >> $GITHUB_STEP_SUMMARY

      - name: Save diff artifact
        if: steps.run.outputs.rate_limited != 'true'
        run: git diff > /tmp/pass1.diff

      - uses: actions/upload-artifact@v4
        if: steps.run.outputs.rate_limited != 'true'
        with:
          name: diff-pass1
          path: /tmp/pass1.diff
          retention-days: 1

      - name: Check TypeScript
        id: tsc
        if: steps.run.outputs.rate_limited != 'true'
        run: docker compose run --rm omniticket sh -c "npm ci && npx tsc --noEmit"
        continue-on-error: true

      - name: Set PR title for pass 1
        if: steps.run.outputs.rate_limited != 'true' && steps.tsc.outcome == 'success'
        id: pr_title
        run: |
          DAY="${{ needs.check.outputs.day }}"
          if [ "${{ needs.check.outputs.focused }}" = "true" ]; then
            echo "title=🤖 Auto-improve: ${{ needs.check.outputs.focus }} ($DAY)" >> $GITHUB_OUTPUT
          else
            echo "title=🤖 Auto-improve pass 1 — $DAY" >> $GITHUB_OUTPUT
          fi

      - name: Build PR body pass 1
        if: steps.run.outputs.rate_limited != 'true' && steps.tsc.outcome == 'success'
        run: |
          DAY="${{ needs.check.outputs.day }}"
          {
            echo "## Automatic improvements — pass 1 · $DAY"
            echo ""
            echo "### Summary of changes"
            cat /tmp/claude-summary-pass1.md
            echo ""
            echo "### Token usage"
            echo "- Input: ${{ steps.run.outputs.input_tokens }} | Output: ${{ steps.run.outputs.output_tokens }} | Cache read: ${{ steps.run.outputs.cache_read }}"
            echo ""
            echo "---"
            echo "⚠️ **Review before merging.**"
          } > /tmp/pr-body-pass1.md

      - name: Create Pull Request
        if: steps.run.outputs.rate_limited != 'true' && steps.tsc.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-improve-${{ needs.check.outputs.day }}-pass1-${{ github.run_number }}
          title: ${{ steps.pr_title.outputs.title }}
          body-path: /tmp/pr-body-pass1.md
          commit-message: "🤖 auto-improve: ${{ needs.check.outputs.day }}, pass 1"
          labels: "auto-improve,needs-review"

      - name: Revert if TypeScript failed
        if: steps.run.outputs.rate_limited != 'true' && steps.tsc.outcome == 'failure'
        run: |
          git checkout .
          git clean -fd
          echo "::warning::Pass 1 — TypeScript check failed. No PR was created."

  pass-2:
    needs: [check, pass-1]
    if: |
      needs.check.outputs.should_run == 'true' &&
      needs.check.outputs.focused != 'true' &&
      needs.pass-1.outputs.rate_limited != 'true'
    runs-on: ubuntu-latest
    outputs:
      rate_limited: ${{ steps.run.outputs.rate_limited }}
      input_tokens: ${{ steps.run.outputs.input_tokens }}
      output_tokens: ${{ steps.run.outputs.output_tokens }}
      cache_read: ${{ steps.run.outputs.cache_read }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: diff-pass1
          path: /tmp

      - name: Install Claude Code
        run: |
          curl -fsSL https://claude.ai/install.sh | bash
          echo "$HOME/.claude/bin" >> $GITHUB_PATH

      - name: Run pass 2
        id: run
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: |
          PREV_DIFF=$(cat /tmp/pass1.diff 2>/dev/null || echo "(no diff)")

          claude -p "
          Read CLAUDE.md before making any changes.

          The previous pass already made these changes (git diff):
          ---
          $PREV_DIFF
          ---

          Find the next highest-value improvements in areas not already modified by the previous pass.
          You can touch any area: TypeScript types, business logic, performance, tests, documentation,
          processing rules, component architecture, security — whatever you judge most valuable.
          No limit on the number of files you can modify.

          RULES:
          - Do not rename public functions/classes/methods
          - Do not change function signatures
          - Do not delete code without verifying it is unreferenced
          - If there is nothing clear to improve, do not force changes

          When done, generate a Markdown summary of the changes:
          - File modified
          - What was changed and why
          " \
          --dangerously-skip-permissions \
          --max-turns 40 \
          --output-format json > /tmp/claude-output.json 2>&1 || true

          if ! jq empty /tmp/claude-output.json 2>/dev/null; then
            echo "::error::Pass 2 — Claude output is not valid JSON. Raw output:"
            head -100 /tmp/claude-output.json
            echo "rate_limited=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          IS_ERROR=$(jq -r '.is_error // false' /tmp/claude-output.json 2>/dev/null)
          RESULT=$(jq -r '.result // ""' /tmp/claude-output.json 2>/dev/null)
          RAW_OUTPUT=$(cat /tmp/claude-output.json 2>/dev/null)

          INPUT_TOKENS=$(jq -r '.usage.input_tokens // 0' /tmp/claude-output.json)
          OUTPUT_TOKENS=$(jq -r '.usage.output_tokens // 0' /tmp/claude-output.json)
          CACHE_READ=$(jq -r '.usage.cache_read_input_tokens // 0' /tmp/claude-output.json)

          echo "### Token usage — Pass 2" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Input tokens | $INPUT_TOKENS |" >> $GITHUB_STEP_SUMMARY
          echo "| Output tokens | $OUTPUT_TOKENS |" >> $GITHUB_STEP_SUMMARY
          echo "| Cache read | $CACHE_READ |" >> $GITHUB_STEP_SUMMARY

          echo "input_tokens=$INPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "output_tokens=$OUTPUT_TOKENS" >> $GITHUB_OUTPUT
          echo "cache_read=$CACHE_READ" >> $GITHUB_OUTPUT

          IS_RATE_LIMITED=false
          if echo "$RESULT$RAW_OUTPUT" | grep -qi "rate limit\|429\|too many requests"; then
            IS_RATE_LIMITED=true
          fi

          if [ "$IS_ERROR" = "true" ] && [ "$IS_RATE_LIMITED" = "false" ]; then
            echo "::error::Pass 2 failed with a non-rate-limit error. Raw output:"
            echo "$RAW_OUTPUT" | head -100
            echo "rate_limited=false" >> $GITHUB_OUTPUT
            exit 0
          fi

          if [ "$IS_RATE_LIMITED" = "true" ]; then
            echo "rate_limited=true" >> $GITHUB_OUTPUT
            echo "::warning::Pass 2 hit rate limit"
          else
            echo "rate_limited=false" >> $GITHUB_OUTPUT
          fi

          echo "$RESULT" > /tmp/claude-summary-pass2.md

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Summary of changes — Pass 2" >> $GITHUB_STEP_SUMMARY
          cat /tmp/claude-summary-pass2.md >> $GITHUB_STEP_SUMMARY

      - name: Check TypeScript
        id: tsc
        if: steps.run.outputs.rate_limited != 'true'
        run: docker compose run --rm omniticket sh -c "npm ci && npx tsc --noEmit"
        continue-on-error: true

      - name: Build PR body pass 2
        if: steps.run.outputs.rate_limited != 'true' && steps.tsc.outcome == 'success'
        run: |
          DAY="${{ needs.check.outputs.day }}"
          {
            echo "## Automatic improvements — pass 2 · $DAY"
            echo ""
            echo "### Summary of changes"
            cat /tmp/claude-summary-pass2.md
            echo ""
            echo "### Token usage"
            echo "- Input: ${{ steps.run.outputs.input_tokens }} | Output: ${{ steps.run.outputs.output_tokens }} | Cache read: ${{ steps.run.outputs.cache_read }}"
            echo ""
            echo "---"
            echo "⚠️ **Review before merging.**"
          } > /tmp/pr-body-pass2.md

      - name: Create Pull Request
        if: steps.run.outputs.rate_limited != 'true' && steps.tsc.outcome == 'success'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-improve-${{ needs.check.outputs.day }}-pass2-${{ github.run_number }}
          title: "🤖 Auto-improve pass 2 — ${{ needs.check.outputs.day }}"
          body-path: /tmp/pr-body-pass2.md
          commit-message: "🤖 auto-improve: ${{ needs.check.outputs.day }}, pass 2"
          labels: "auto-improve,needs-review"

      - name: Revert if TypeScript failed
        if: steps.run.outputs.rate_limited != 'true' && steps.tsc.outcome == 'failure'
        run: |
          git checkout .
          git clean -fd
          echo "::warning::Pass 2 — TypeScript check failed. No PR was created."
